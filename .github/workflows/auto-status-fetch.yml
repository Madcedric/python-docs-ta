name: Continuous Dashboard Update

on:
  schedule:
    # Triggers every single day at 00:00 UTC completely automatically
    - cron: '0 0 * * *'
  workflow_dispatch: # Maintains manual click-to-run button in the Actions panel

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    
    # Grants write access back to the workspace tree branch
    permissions:
      contents: write

    steps:
    - name: Access Repository Workspace
      uses: actions/checkout@v4

    - name: Initialize Environment Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Speeds up executions over time

    - name: Provisions Dependency Libraries
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Fire Python Automation Script
      run: python fetch-status-data.py

    - name: Deploy Synchronized Core Updates
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        # Track both target files for updates
        git add README.md live_graph.png
        
        # Deploy and save modifications only if fresh data creates actual differences
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-sync platform data visuals" && git push)
