name: Scheduled Data Fetch

on:
  schedule:
    # This crontab schedules the action to run every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to manually trigger the script from the Actions tab

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    
    # Critical: Grant permission to the Action runner to write changes to your repo
    permissions:
      contents: write

    steps:
    # 1. Checkout the repository code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Install Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.10'

    # 3. Install required libraries
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Execute your fetching script
    - name: Run data fetch script
      run: python fetch_data.py

    # 5. Commit and push the modified data.json back to the repository
    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data.json
        # Only commit if data.json actually changed to prevent empty commits
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated data update" && git push)
