name: Push Specific Translation to Transifex

on:
  push:
    branches:
      - '3.15'
    paths:
      - '**.po'
      - '**/LC_MESSAGES/*.po'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-to-tx:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: 3

      - name: Install Dependencies
        run: |
          sudo apt-get install -y gettext
          pip install requests cogapp polib transifex-python sphinx-intl blurb six
          curl -o- https://raw.githubusercontent.com/transifex/cli/master/install.sh | bash
          sudo mv tx /usr/local/bin/

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recreate Transifex Config
        run: |
          curl -O https://raw.githubusercontent.com/python-docs-translations/transifex-automations/master/sample-workflows/transifex-util.py
          python transifex-util.py recreate_tx_config --language ta --project-slug python-newest --version 3.15
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}

      - name: Identify and Push Changed Files
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA="HEAD~1"
          fi

          echo "Analyzing changes between $BEFORE_SHA and ${{ github.sha }}..."
          
          CHANGED_FILES=$(git diff --name-only $BEFORE_SHA ${{ github.sha }} | grep '\.po$' || true)
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No translation (.po) files were changed in this push."
            exit 0
          fi

          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              echo "Processing modified file: $file"
              
              # Export the target filename to an environment variable for Python to read safely
              export TARGET_FILE=$(basename "$file")
              
              # NEW PARSER: Instead of stripping headers, find the exact section name containing the filename mapping
              # Examples of matches: 'o:python-doc:p:python-newest:r:bugs--315' or 'python-newest.bugs'
              # It looks directly at the keys/values for a path matching your file name.
              RAW_RESOURCE=$(python3 -c "import os, configparser; c = configparser.ConfigParser(); c.read('.tx/config'); print(''.join([s for s in c.sections() if any(os.environ['TARGET_FILE'] in v for k, v in c.items(s))][:1]))" || true)

              if [ -z "$RAW_RESOURCE" ]; then
                echo "Warning: Could not resolve a Transifex resource mapping for $file inside .tx/config"
                continue
              fi
              
              echo "Found matching Transifex configuration section: $RAW_RESOURCE"
              
              # If the section name contains the full organization prefix 'o:...', the tx CLI allows you to use the resource slug at the end.
              # Let's cleanly normalize it so the Transifex CLI parses it correctly.
              if [[ "$RAW_RESOURCE" == *"_tx_"* ]] || [[ "$RAW_RESOURCE" == *":r:"* ]]; then
                 # Extract everything after the last resource indicator ':r:' or split by components
                 RESOURCE_SLUG=$(echo "$RAW_RESOURCE" | sed 's/.*:r://')
                 FINAL_RESOURCE="python-newest.$RESOURCE_SLUG"
              else
                 FINAL_RESOURCE="$RAW_RESOURCE"
              fi

              echo "Resolved target Transifex Resource ID: $FINAL_RESOURCE"
              
              # Force push using the exact resolved resource ID mapping found in the config file
              tx push --translation --force --languages ta --resources "$FINAL_RESOURCE"
            else
              echo "Skipping missing or deleted file: $file"
            fi
          done
