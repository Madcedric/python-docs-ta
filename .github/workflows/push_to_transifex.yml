name: Push Specific Translation to Transifex

on:
  push:
    branches:
      - '3.15'
    paths:
      - '**.po'
      - '**/LC_MESSAGES/*.po'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-to-tx:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: 3

      - name: Install Dependencies
        run: |
          sudo apt-get install -y gettext
          pip install requests cogapp polib transifex-python sphinx-intl blurb six
          curl -o- https://raw.githubusercontent.com/transifex/cli/master/install.sh | bash
          sudo mv tx /usr/local/bin/

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recreate Transifex Config
        run: |
          curl -O https://raw.githubusercontent.com/python-docs-translations/transifex-automations/master/sample-workflows/transifex-util.py
          python transifex-util.py recreate_tx_config --language ta --project-slug python-newest --version 3.15
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}

      - name: Identify and Push Changed Files
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA="HEAD~1"
          fi

          echo "Analyzing changes between $BEFORE_SHA and ${{ github.sha }}..."
          
          CHANGED_FILES=$(git diff --name-only $BEFORE_SHA ${{ github.sha }} | grep '\.po$' || true)
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No translation (.po) files were changed in this push."
            exit 0
          fi

          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              echo "Processing modified file: $file"
              
              # Extract the resource name (e.g., 'bugs.po' or 'library/functions.po' -> 'bugs' or 'functions')
              FILENAME=$(basename "$file" .po)
              
              # Strip periods from version string to match Transifex resource structure (3.15 -> 315)
              CLEAN_VER=$(echo "3.15" | tr -d '.')
              
              # Construct the exact Transifex resource slug
              RESOURCE_ID="python-newest.${FILENAME}--${CLEAN_VER}"
              echo "Targeting Transifex Resource ID: $RESOURCE_ID"
              
              # Push the specific translation file via its mapped Resource ID
              tx push --translation --languages ta --resources "$RESOURCE_ID"
            else
              echo "Skipping missing or deleted file: $file"
            fi
          done
