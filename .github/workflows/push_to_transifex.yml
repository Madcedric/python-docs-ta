name: Push Specific Translation to Transifex

on:
  push:
    branches:
      - '3.15'
    paths:
      - '**/*.po'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-to-tx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: 3

      - name: Install Dependencies
        run: |
          # Install system level dependencies required by CPython Doc build tools
          sudo apt-get install -y gettext
          
          # Install Python libraries needed by transifex-util.py
          pip install requests cogapp polib transifex-python sphinx-intl blurb six
          
          # Install the Transifex CLI
          curl -o- https://raw.githubusercontent.com/transifex/cli/master/install.sh | bash
          sudo mv tx /usr/local/bin/

      - uses: actions/checkout@v4
        with:
          # Fetch the entire history so Git has access to both commits during the diff comparison
          fetch-depth: 0

      - name: Recreate Transifex Config
        run: |
          curl -O https://raw.githubusercontent.com/python-docs-translations/transifex-automations/master/sample-workflows/transifex-util.py
          python transifex-util.py recreate_tx_config --language ta --project-slug python-newest --version 3.15
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}

      - name: Identify and Push Changed Files
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: |
          echo "Analyzing changes between ${{ github.event.before }} and ${{ github.sha }}..."
          
          # Pinpoint exactly what translation files changed in this push event
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '\.po$' || true)
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No .po files were modified in this push."
            exit 0
          fi

          for file in $CHANGED_FILES; do
            # Double check that the file actually exists on disk (handles cases where a file might have been deleted)
            if [ -f "$file" ]; then
              echo "Uploading updated file: $file"
              tx push --translations --languages ta --file "$file"
            else
              echo "Skipping file (deleted or missing): $file"
            fi
          done
